<link rel="stylesheet" href="styles.css">
<style>
body{margin:0}
a{color:#1C1917}

input::placeholder,textarea::placeholder{color:#8E857F}
.noscroll{scrollbar-width:none;-ms-overflow-style:none}
.noscroll::-webkit-scrollbar{display:none;width:0;height:0}
</style>

<body>
<main class="stage">
<div class="device">
<div class="screen" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Thmanyah Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #1C1917; direction: rtl; display: flex; flex-direction: column">
<div style="flex: none; padding: 32px 18px 12px; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; background: #FFFFFF">
<a href="addresses.html" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #1C1917"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.43 5.93 20.5 12l-6.07 6.07M3.5 12h16.83" stroke-miterlimit="10"></path></svg></a>
<h1 style="margin: 0; text-align: center; font-size: 20px; line-height: 28px; font-weight: 700">عنوان جديد</h1>
<span aria-hidden="true"></span>
</div>
<div class="noscroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; line-height: 20px; font-weight: 700; color: #6B635D">اسم العنوان</span><div style="display: flex; gap: 8px"><button type="button" data-af-label="البيت" aria-pressed="true" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #1C1917; color: #FFFFFF; font-weight: 700; font-family: inherit; font-size: 13px">البيت</button><button type="button" data-af-label="الشغل" aria-pressed="false" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #F7F3F0; color: #1C1917; font-weight: 500; font-family: inherit; font-size: 13px">الشغل</button><button type="button" data-af-label="تاني" aria-pressed="false" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #F7F3F0; color: #1C1917; font-weight: 500; font-family: inherit; font-size: 13px">تاني</button></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="af-city" style="font-size: 13px; line-height: 20px; font-weight: 700; color: #6B635D">المدينة *</label><button id="af-city" type="button" data-af-city style="min-height: 52px; border-radius: 16px; background: #F7F3F0; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-sizing: border-box; border: 0; width: 100%; font-family: inherit; font-size: 15px; color: #1C1917; text-align: right"><span data-af-city-value style="flex: 1">الرياض</span><span style="color: #8E857F; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.92 8.95 13.4 15.47c-.77.77-2.03.77-2.8 0L4.08 8.95"></path></svg></span></button><span style="font-size: 12px; line-height: 18px; color: #8E857F">رسوم التوصيل بتتحسب على حسب المدينة.</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="af-line" style="font-size: 13px; line-height: 20px; font-weight: 700; color: #6B635D">العنوان التفصيلي *</label><span style="min-height: 52px; border-radius: 16px; background: #F7F3F0; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-sizing: border-box; align-items: flex-start; padding: 14px 16px"><textarea id="af-line" data-af-line rows="3" placeholder="الحي، الشارع، رقم المبنى، وأي علامة مميزة" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 15px; color: #1C1917; resize: none; line-height: 22px; padding: 0">حي النرجس، شارع الأمير سعود بن عبدالله، فيلا 14</textarea></span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><button type="button" role="checkbox" aria-checked="true" data-af-check="default" style="width: 100%; border: 0; border-radius: 16px; background: #F7F3F093; padding: 12px 14px; display: flex; align-items: center; gap: 12px; font-family: inherit; color: #1C1917; text-align: right"><span aria-hidden="true" style="width: 22px; height: 22px; flex: none; box-sizing: border-box; border-radius: 7px; background: #C2410C; border: 0; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; line-height: 22px; font-weight: 700">خليه العنوان الافتراضي</span><span style="font-size: 12px; line-height: 18px; color: #6B635D">بيتختار تلقائيًا في إتمام الطلب</span></span></button><button type="button" role="checkbox" aria-checked="false" data-af-check="pickup" style="width: 100%; border: 0; border-radius: 16px; background: #F7F3F093; padding: 12px 14px; display: flex; align-items: center; gap: 12px; font-family: inherit; color: #1C1917; text-align: right"><span aria-hidden="true" style="width: 22px; height: 22px; flex: none; box-sizing: border-box; border-radius: 7px; background: #FFFFFF; border: 2px solid #C9BFB7; display: flex; align-items: center; justify-content: center"></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; line-height: 22px; font-weight: 700">استخدمه لاستلام مبيعاتي</span><span style="font-size: 12px; line-height: 18px; color: #6B635D">المندوب هيستلم القطع اللي بتبيعها من هنا</span></span></button></div>
</div>
<div style="flex: none; padding: 14px 18px 28px; background: #FFFFFF; box-shadow: 0 -8px 24px rgba(28,25,23,0.06); display: flex; gap: 10px"><button type="button" data-af-save style="flex: 1; height: 54px; border: 0; border-radius: 999px; background: #1C1917; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">حفظ العنوان</button></div>
</div>
</div>
</main>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
