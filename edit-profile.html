<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>outlet · البيانات الشخصية</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script>

  if (standalone) document.documentElement.classList.add('standalone');

<link rel="stylesheet" href="styles.css">
<style>
body{margin:0}
a{color:#1C1917}
a:hover{color:#000000}
input::placeholder,textarea::placeholder{color:#8E857F}
.noscroll{scrollbar-width:none;-ms-overflow-style:none}
.noscroll::-webkit-scrollbar{display:none;width:0;height:0}
</style>
</head>
<body>
<main class="stage">
<div class="device">
<div class="screen" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Thmanyah Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #1C1917; direction: rtl; display: flex; flex-direction: column">
<div style="flex: none; padding: 32px 18px 12px; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; background: #FFFFFF">
<a href="settings.html" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #1C1917"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.43 5.93 20.5 12l-6.07 6.07M3.5 12h16.83" stroke-miterlimit="10"></path></svg></a>
<h1 style="margin: 0; text-align: center; font-size: 20px; line-height: 28px; font-weight: 700">البيانات الشخصية</h1>
<span aria-hidden="true"></span>
</div>
<div class="noscroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0 6px"><span data-ep-initial aria-hidden="true" style="width: 72px; height: 72px; border-radius: 999px; background: #FDEBDD; color: #9A3412; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center">ل</span><span style="font-size: 12px; line-height: 18px; color: #8E857F">عضو من نوفمبر 2026</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ep-name" style="font-size: 13px; line-height: 20px; font-weight: 700; color: #6B635D">الاسم</label><span style="min-height: 52px; border-radius: 16px; background: #F7F3F0; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-sizing: border-box"><input id="ep-name" data-ep-name type="text" value="لمى الحربي" autocomplete="name" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 15px; color: #1C1917"></span><span style="font-size: 12px; line-height: 18px; color: #8E857F">الاسم اللي بيظهر للبائعين والمشترين في الطلبات والمحادثات.</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ep-phone" style="font-size: 13px; line-height: 20px; font-weight: 700; color: #6B635D">رقم الجوال</label><span style="min-height: 52px; border-radius: 16px; background: #F7F3F0; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-sizing: border-box"><span id="ep-phone" data-ep-phone style="flex: 1; font-size: 15px; direction: ltr; text-align: right">+966 55 123 4567</span><button type="button" data-ep-change-phone style="border: 0; background: transparent; padding: 6px 0; font-family: inherit; font-size: 13px; font-weight: 700; color: #C2410C">تغيير</button></span><span style="font-size: 12px; line-height: 18px; color: #8E857F">تغيير الرقم محتاج رمز تحقق يوصل على الرقم الجديد.</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ep-city" style="font-size: 13px; line-height: 20px; font-weight: 700; color: #6B635D">المدينة</label><button id="ep-city" type="button" data-ep-city style="min-height: 52px; border-radius: 16px; background: #F7F3F0; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-sizing: border-box; border: 0; width: 100%; font-family: inherit; font-size: 15px; color: #1C1917; text-align: right"><span data-ep-city-value style="flex: 1">الرياض</span><span style="color: #8E857F; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.92 8.95 13.4 15.47c-.77.77-2.03.77-2.8 0L4.08 8.95"></path></svg></span></button></div>
<div style="padding: 12px 14px; border-radius: 16px; background: #F7F3F093; display: flex; gap: 8px; font-size: 12px; line-height: 18px; color: #6B635D"><span style="display: flex; flex: none; margin-top: 1px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10ZM12 8v5M11.995 16h.009"></path></svg></span><span>التعديل مش بيغيّر بيانات الطلبات اللي اتدفعت قبل كده.</span></div>
</div>
<div style="flex: none; padding: 14px 18px 28px; background: #FFFFFF; box-shadow: 0 -8px 24px rgba(28,25,23,0.06); display: flex; gap: 10px"><a href="settings.html" data-ep-cancel style="flex: 1; height: 54px; border: 0; border-radius: 999px; background: #F7F3F0; color: #1C1917; font-family: inherit; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">إلغاء</a><button type="button" data-ep-save style="flex: 1.4; height: 54px; border: 0; border-radius: 999px; background: #1C1917; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">حفظ التغييرات</button></div>
</div>
</div>
</main>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
