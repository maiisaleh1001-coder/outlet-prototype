<button type="button" role="radio" aria-checked="true" data-pay="mada" style="width: 100%; border: 0; border-radius: 18px; background: #FFF4EC; padding: 14px; display: flex; align-items: center; gap: 12px; font-family: inherit; color: #1C1917; text-align: right"><span aria-hidden="true" style="width: 22px; height: 22px; flex: none; box-sizing: border-box; border-radius: 999px; border: 2px solid #C2410C; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 999px; background: #C2410C"></span></span><span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.5h20M6 16.5h2M10.5 16.5h4"></path><path d="M6.44 3.5h11.11c3.56 0 4.45.88 4.45 4.39v8.21c0 3.51-.89 4.39-4.44 4.39H6.44C2.89 20.5 2 19.62 2 16.11V7.89C2 4.38 2.89 3.5 6.44 3.5Z"></path></svg></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; line-height: 22px; font-weight: 700">بطاقة مدى</span><span style="font-size: 12px; line-height: 18px; color: #6B635D">بطاقة الصراف البنكية</span></span></button>

<div style="display: flex; gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0"><span style="font-size: 12px; line-height: 16px; color: #6B635D">تاريخ الانتهاء</span><input inputmode="numeric" autocomplete="cc-exp" data-card="exp" placeholder="MM / YY" style="height: 48px; box-sizing: border-box; border: 0; outline: 0; border-radius: 14px; background: #F7F3F093; padding: 0 14px; font-family: inherit; font-size: 15px; color: #1C1917; direction: ltr; text-align: right"></label>
