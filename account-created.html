@keyframes sx-up{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
@keyframes sx-bar{0%{width:0}100%{width:100%}}
@media (prefers-reduced-motion: reduce){.sx-badge,.sx-halo,.sx-check,.sx-up,.sx-bar{animation:none}.sx-check{stroke-dashoffset:0}.sx-halo{opacity:0}}
